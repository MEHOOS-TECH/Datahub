<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenData GH – Data Resell Platform</title>
  <meta name="description" content="Buy and resell MTN data bundles in Ghana. Instant delivery, free dashboard.">

  <!-- DNS prefetch for external services -->
  <link rel="dns-prefetch" href="https://lbflhbogfhtnjjnxjntb.supabase.co">
  <link rel="dns-prefetch" href="https://js.paystack.co">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts: load async so they don't block render -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
  </noscript>

  <style>
    /* Critical above-the-fold CSS inlined so page renders immediately */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e;
      color: #e8edf7;
      font-family: 'DM Sans', Arial, sans-serif;
      min-height: 100vh;
    }
    #root { min-height: 100vh; }

    /* Loading skeleton shown before React mounts */
    #app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(0,229,255,0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="root">
    <!-- Shown instantly while React loads -->
    <div id="app-loading">
      <div class="spinner"></div>
      <div style="color:#6b7fa3;font-size:14px">Loading GenData GH…</div>
    </div>
  </div>

  <!-- React: defer so it doesn't block HTML parsing -->
  <script defer src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Paystack: load after page is interactive -->
  <script defer src="https://js.paystack.co/v1/inline.js"></script>

  <!-- Your app: defer, loads last -->
  <script defer src="/app.js"></script>

</body>
</html>
