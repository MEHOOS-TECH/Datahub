<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DataResell Pro</title>

<!-- Critical: preconnect to font origins -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<!-- Non-blocking font load (swap trick) -->
<link rel="preload" as="style"
  href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
  onload="this.onload=null;this.rel='stylesheet'"/>
<noscript>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"/>
</noscript>

<!-- App styles (separate file — browser can cache independently) -->
<link rel="stylesheet" href="styles.css"/>

<!-- Loader shown immediately while JS loads -->
<style>
  #loader{position:fixed;inset:0;background:#0a0f1e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;z-index:99999;transition:opacity .4s ease}
  #loader.hidden{opacity:0;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ld-spin{width:44px;height:44px;border:3px solid rgba(0,229,255,.15);
    border-top-color:#00e5ff;border-radius:50%;animation:spin .7s linear infinite}
  .ld-text{color:#6b7fa3;font-family:sans-serif;font-size:14px;font-weight:500;letter-spacing:0.3px}
</style>

<!-- React: defer so HTML parses without blocking -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

<!-- App: defer, loads in parallel with React -->
<script defer src="app.js"></script>
</head>
<body>
<div id="loader"><div class="ld-spin"></div><div class="ld-text">Loading…</div></div>
<div id="root"></div>
<!-- Paystack: loaded on-demand when user initiates payment -->
</body>
</html>
