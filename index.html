<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
padding:20px;
}
.container{max-width:600px}
.logo{font-size:60px;margin-bottom:20px}
h1{font-size:2.5rem;margin-bottom:15px}
p{font-size:1.1rem;color:#cbd5e1;line-height:1.7;margin-bottom:20px}
.status{
display:inline-block;
background:#22c55e;
padding:10px 20px;
border-radius:30px;
font-weight:bold;
}
.footer{margin-top:30px;color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="logo">🚧</div>
<h1>We're Updating Our Store</h1>
<p>
We are currently adding more products and improving our services.
The website is temporarily under construction and will be back online
in a few hours.
</p>
<div class="status">We'll Be Back Soon</div>
<div class="footer">Thank you for your patience and support.</div>
</div>
</body>
</html>
