body{background:#0a0f1e;color:#e8edf7;font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0f1e}
::-webkit-scrollbar-thumb{background:#1e2d45;border-radius:3px}
.syne{font-family:'Syne',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,229,255,.15)}50%{box-shadow:0 0 40px rgba(0,229,255,.35)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fade-up{animation:fadeUp .5s ease forwards}
.fa1{animation-delay:.05s;opacity:0}.fa2{animation-delay:.15s;opacity:0}.fa3{animation-delay:.25s;opacity:0}
.fa4{animation-delay:.35s;opacity:0}.fa5{animation-delay:.45s;opacity:0}.fa6{animation-delay:.55s;opacity:0}
.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-top-color:#00e5ff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@media(min-width:700px){.sidebar-desktop{display:flex!important}.mobile-nav{display:none!important}}
@media(max-width:699px){.sidebar-desktop{display:none!important}}
select option{background:#111827;color:#e8edf7}


/* Hide scrollbar on mobile nav */
.mobile-nav div::-webkit-scrollbar{display:none}
/* Mobile-first dashboard sizing */
@media(max-width:699px){
  .dash-main{padding:12px 10px!important}
  .stat-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .syne{letter-spacing:-0.3px}
}
@media(max-width:380px){
  .stat-val{font-size:16px!important}
}

/* Premium card hover effects */
.stat-hover:hover{transform:translateY(-2px);transition:transform .2s cubic-bezier(0.34,1.56,0.64,1);}

/* Noise texture overlay for depth */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.3;
}

/* New dashboard ambient light effects */
.dash-ambient-left{
  position:fixed;top:0;left:0;width:300px;height:300px;
  background:radial-gradient(circle,rgba(0,255,198,0.04),transparent 70%);
  pointer-events:none;z-index:0;
}
.dash-ambient-right{
  position:fixed;bottom:0;right:0;width:250px;height:250px;
  background:radial-gradient(circle,rgba(123,97,255,0.04),transparent 70%);
  pointer-events:none;z-index:0;
}

@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Landing page mobile fixes */
@media(max-width:600px){
  .live-stats-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}

  .buy-view-btn{align-self:stretch;justify-content:center!important}
  .cta-btns{flex-direction:column!important}
  .cta-btns button{width:100%!important;box-sizing:border-box!important}
  .benefits-grid{grid-template-columns:1fr!important}
  .hero-btns{flex-direction:column!important;align-items:stretch!important}
  .hero-btns button{width:100%!important}

/* ── Page Loader ── */
#loader{position:fixed;inset:0;background:#0a0f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99999;transition:opacity .4s ease}
#loader.hidden{opacity:0;pointer-events:none}
.ld-spin{width:44px;height:44px;border:3px solid rgba(0,229,255,.15);border-top-color:#00e5ff;border-radius:50%;animation:spin .7s linear infinite}
.ld-text{color:#6b7fa3;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.3px}

.sf-body{background:linear-gradient(145deg,#0d0d1a 0%,#0f1628 50%,#0a1020 100%);min-height:100vh;font-family:'DM Sans',sans-serif;}
.sf-net-card{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px 22px;display:flex;align-items:center;gap:18;cursor:pointer;transition:all .25s cubic-bezier(0.34,1.56,0.64,1);backdrop-filter:blur(10px);}
.sf-net-card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(255,255,255,0.2);box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.sf-bundle-card{border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden;}

.paystack-btn{width:100%;padding:17px;border-radius:16px;border:none;font-weight:800;font-size:17px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:0.3px;position:relative;overflow:hidden;}
.paystack-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s;}
.paystack-btn:hover::after{transform:translateX(100%);}

.track-step{display:flex;align-items:flex-start;gap:14px;padding:14px 0;}
.track-step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;position:relative;}
.track-step-dot::after{content:'';position:absolute;top:32px;left:50%;transform:translateX(-50%);width:2px;height:calc(100% + 2px);background:rgba(255,255,255,0.08);}
.track-step:last-child .track-step-dot::after{display:none;}
.order-id-box{background:rgba(0,229,255,0.08);border:1.5px dashed rgba(0,229,255,0.35);border-radius:14px;padding:14px 18px;text-align:center;cursor:pointer;transition:background .2s;}
