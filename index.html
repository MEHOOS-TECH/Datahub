/* ── StoreFront (customer-facing purchase page) ── */
function StoreFront({slug}){
  const [reseller,  setReseller]  = useState(null);
  const [notFound,  setNotFound]  = useState(false);
  const [network,   setNetwork]   = useState(null);
  const [selected,  setSelected]  = useState(null);
  const [phone,     setPhone]     = useState("");
  const [email,     setEmail]     = useState("");
  const [buying,    setBuying]    = useState(false);
  const [done,      setDone]      = useState(null);
  const [toast,     setToast]     = useState({msg:"",type:""});
  const [resellerPrices, setResellerPrices] = useState({});

  const PAYSTACK_PK = "pk_live_d093131f6a1823be2cf892e9378027de29ddc7b1";

  const showToast=(msg,type="success")=>{
    setToast({msg,type}); setTimeout(()=>setToast({msg:"",type:""}),3500);
  };

  useEffect(()=>{
    sb("resellers?store_slug=eq."+slug+"&select=*")
      .then(r=>{
        if(r&&r.length){
          setReseller(r[0]);
          return sb("reseller_prices?reseller_id=eq."+r[0].id+"&select=bundle_id,price");
        } else { setNotFound(true); return []; }
      })
      .then(prices=>{
        if(prices&&prices.length){
          const map = {};
          prices.forEach(p=>{ map[p.bundle_id]=parseFloat(p.price); });
          setResellerPrices(map);
        }
      })
      .catch(()=>setNotFound(true));
  },[slug]);

  const getPrice = (b) => resellerPrices[b.id] || b.base;

  const NET_META = {
    MTN:       { color:"#FFCD00", glow:"rgba(255,205,0,0.35)", dark:"#1a1400", label:"MTN", grad:"linear-gradient(135deg,#FFCD00,#FF9500)" },
    AirtelTigo:{ color:"#FF3B30", glow:"rgba(255,59,48,0.35)",  dark:"#1a0000", label:"AirtelTigo", grad:"linear-gradient(135deg,#FF3B30,#FF6B00)" },
    Telecel:   { color:"#007AFF", glow:"rgba(0,122,255,0.35)",  dark:"#00091a", label:"Telecel", grad:"linear-gradient(135deg,#007AFF,#5856D6)" },
  };

  const NET_LOGO = {
    MTN: <div style={{width:58,height:58,background:"linear-gradient(135deg,#FFCD00,#FF9500)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,color:"#000",fontFamily:"sans-serif",letterSpacing:-0.5,boxShadow:"0 4px 20px rgba(255,205,0,0.4)"}}>MTN</div>,
    AirtelTigo: <div style={{width:58,height:58,background:"linear-gradient(135deg,#FF3B30,#FF6B00)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:10,fontFamily:"sans-serif",textAlign:"center",lineHeight:1.2,boxShadow:"0 4px 20px rgba(255,59,48,0.4)"}}>airtel<br/>tigo</div>,
    Telecel: <div style={{width:58,height:58,background:"linear-gradient(135deg,#007AFF,#5856D6)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:18,fontFamily:"sans-serif",boxShadow:"0 4px 20px rgba(0,122,255,0.4)"}}>t</div>,
  };

  const recordOrder = async(paystackRef)=>{
    const amount = getPrice(selected);
    const bundleStr = selected.label+" - GHS"+amount.toFixed(2);
    try{
      await sb("resellers?id=eq."+reseller.id,{method:"PATCH",prefer:"return=representation",
        body:JSON.stringify({
          total_sales:(reseller.total_sales||0)+amount,
          total_customers:(reseller.total_customers||0)+1
        })});
      await sb("transactions",{method:"POST",prefer:"return=representation",
        body:JSON.stringify({
          reseller_id:reseller.id, network, bundle:bundleStr, amount,
          customer_phone:phone, status:"success", type:"data_purchase",
          payment_ref: paystackRef
        })});
      setDone({bundle:selected,phone,amount,network,ref:paystackRef});
    }catch(e){ showToast("Order error: "+e.message,"error"); }
  };

  const handlePaystack = ()=>{
    if(!phone.trim()){showToast("Please enter your phone number","error");return;}
    if(phone.trim().length<10){showToast("Enter a valid 10-digit phone number","error");return;}
    const amount = getPrice(selected);
    const customerEmail = email.trim() || (phone.trim().replace(/^0/,"233")+"@customer.com");

    if(typeof PaystackPop === "undefined"){
      showToast("Payment system loading… Please try again","error"); return;
    }

    const handler = PaystackPop.setup({
      key: PAYSTACK_PK,
      email: customerEmail,
      amount: Math.round(amount * 100), // pesewas
      currency: "GHS",
      ref: "_G"+reseller.store_name.replace(/\s+/g,"").toUpperCase().slice(0,12)+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,6).toUpperCase(),
      metadata: {
        custom_fields:[
          {display_name:"Phone Number",variable_name:"phone",value:phone},
          {display_name:"Network",variable_name:"network",value:network},
          {display_name:"Bundle",variable_name:"bundle",value:selected.label},
          {display_name:"Store",variable_name:"store",value:reseller.store_name},
        ]
      },
      callback: (response)=>{
        setBuying(false);
        recordOrder(response.reference);
      },
      onClose: ()=>{ setBuying(false); showToast("Payment cancelled","error"); }
    });
    setBuying(true);
    handler.openIframe();
  };

  /* ── Loading ── */
  if(!reseller && !notFound) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(145deg,#0d0d1a,#0f1628)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,border:"3px solid rgba(255,255,255,.1)",borderTop:"3px solid #00e5ff",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
      <div style={{color:"rgba(255,255,255,.4)",fontSize:14}}>Loading store…</div>
    </div>
  );

  /* ── Not Found ── */
  if(notFound) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(145deg,#0d0d1a,#0f1628)",display:"flex",alignItems:"center",
      justifyContent:"center",flexDirection:"column",gap:16,padding:24,textAlign:"center"}}>
      <div style={{fontSize:64}}>🔍</div>
      <div className="syne" style={{fontSize:24,fontWeight:800,color:"#fff"}}>Store Not Found</div>
      <div style={{color:"rgba(255,255,255,.5)"}}>This store link doesn't exist or may have changed.</div>
      <a href="/" style={{color:"#00e5ff",fontWeight:600,fontSize:15}}>← Back to DataResell Pro</a>
    </div>
  );

  /* ── Success ── */
  if(done) return(
    <div className="sf-body" style={{display:"flex",alignItems:"center",justifyContent:"center",padding:20,minHeight:"100vh"}}>
      <div style={{maxWidth:400,width:"100%",textAlign:"center",animation:"fadeUp .5s ease"}}>
        <div style={{width:88,height:88,background:"linear-gradient(135deg,#00d68f,#00b37a)",borderRadius:"50%",
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,margin:"0 auto 24px",
          boxShadow:"0 0 60px rgba(0,214,143,0.5)"}}>✅</div>
        <div className="syne" style={{fontSize:28,fontWeight:800,color:"#fff",marginBottom:8}}>Payment Successful!</div>
        <div style={{color:"rgba(255,255,255,.5)",fontSize:15,marginBottom:32}}>Your data bundle order has been received.</div>

        <div style={{background:"rgba(255,255,255,.05)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,.1)",borderRadius:20,padding:24,textAlign:"left",marginBottom:28}}>
          {[["Network",done.network],["Bundle",done.bundle.label],["Phone",done.phone],["Amount","GH₵ "+done.amount.toFixed(2)],["Ref",done.ref]].map(([k,v])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
              <span style={{color:"rgba(255,255,255,.4)",fontSize:13}}>{k}</span>
              <span style={{fontWeight:700,fontSize:14,color:"#fff",maxWidth:"60%",textAlign:"right",wordBreak:"break-all"}}>{v}</span>
            </div>
          ))}
        </div>
        <button onClick={()=>{setDone(null);setSelected(null);setPhone("");setEmail("");setNetwork(null);}}
          style={{...btnStyle("primary"),width:"100%",padding:16,fontSize:16,borderRadius:16}}>
          Buy Another Bundle →
        </button>
        <div style={{marginTop:20,fontSize:12,color:"rgba(255,255,255,.25)"}}>
          Powered by <span style={{color:"#00e5ff",fontWeight:600}}>DataResell Pro</span>
        </div>
      </div>
    </div>
  );

  const meta       = network ? NET_META[network] : null;
  const bundles    = network ? BASE_BUNDLES[network] : [];

  /* ────────── MAIN RENDER ────────── */
  return(
    <div className="sf-body">
      <Toast msg={toast.msg} type={toast.type}/>

      {/* Decorative bg blobs */}
      <div style={{position:"fixed",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:0}}>
        <div style={{position:"absolute",top:"-20%",left:"-10%",width:500,height:500,
          background:"radial-gradient(circle,rgba(0,229,255,0.06),transparent 70%)",borderRadius:"50%"}}/>
        <div style={{position:"absolute",bottom:"-10%",right:"-10%",width:400,height:400,
          background:"radial-gradient(circle,rgba(123,97,255,0.07),transparent 70%)",borderRadius:"50%"}}/>
      </div>

      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:50,backdropFilter:"blur(20px)",
        background:"rgba(10,10,26,0.85)",borderBottom:"1px solid rgba(255,255,255,.06)",
        padding:"14px 20px",display:"flex",alignItems:"center",gap:14}}>
        {network && (
          <button onClick={()=>{setNetwork(null);setSelected(null);}}
            style={{background:"rgba(255,255,255,.08)",border:"none",cursor:"pointer",
              color:"rgba(255,255,255,.7)",padding:"8px 14px",borderRadius:10,fontSize:14,
              fontWeight:600,fontFamily:"'DM Sans',sans-serif",transition:"all .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.12)"}
            onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.08)"}>
            ← Back
          </button>
        )}
        <div style={{width:40,height:40,background:"linear-gradient(135deg,#00e5ff,#7b61ff)",
          borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",
          fontWeight:800,fontSize:18,color:"#fff",flexShrink:0,
          boxShadow:"0 4px 20px rgba(0,229,255,0.3)"}}>
          {reseller.store_name[0].toUpperCase()}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:15,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {reseller.store_name}
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.4)",marginTop:1}}>Data Bundle Store</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(0,214,143,.15)",
          borderRadius:20,padding:"5px 12px",border:"1px solid rgba(0,214,143,.25)"}}>
          <div style={{width:7,height:7,background:"#00d68f",borderRadius:"50%",animation:"pulse 2s infinite"}}/>
          <span style={{fontSize:11,color:"#00d68f",fontWeight:600}}>Live</span>
        </div>
      </div>

      <div style={{position:"relative",zIndex:1,maxWidth:500,margin:"0 auto",padding:"24px 18px 40px"}}>

        {/* ── NETWORK PICKER ── */}
        {!network && (
          <>
            <div style={{textAlign:"center",marginBottom:32,paddingTop:8}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:8,
                background:"rgba(0,229,255,.1)",border:"1px solid rgba(0,229,255,.2)",
                borderRadius:20,padding:"5px 16px",marginBottom:18}}>
                <span style={{fontSize:14}}>⚡</span>
                <span style={{fontSize:12,color:"#00e5ff",fontWeight:600,letterSpacing:0.5}}>INSTANT DELIVERY</span>
              </div>
              <div className="syne" style={{fontSize:30,fontWeight:800,color:"#fff",lineHeight:1.2,marginBottom:10}}>
                Buy Data Bundles
              </div>
              <div style={{color:"rgba(255,255,255,.45)",fontSize:15}}>
                Choose your network to get started
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {Object.keys(BASE_BUNDLES).map((n,i)=>{
                const m = NET_META[n];
                const isOutOfStock = BASE_BUNDLES[n].every(b=>b.outOfStock);
                const minPrice = Math.min(...BASE_BUNDLES[n].map(b=>getPrice(b)));
                return(
                  <button key={n} className="sf-net-card" onClick={()=>!isOutOfStock&&setNetwork(n)}
                    style={{background:isOutOfStock?"rgba(255,255,255,.02)":"rgba(255,255,255,.04)",
                      border:"1.5px solid "+(isOutOfStock?"rgba(255,255,255,.04)":"rgba(255,255,255,.08)"),
                      borderRadius:20,padding:"20px 22px",display:"flex",alignItems:"center",gap:18,
                      cursor:isOutOfStock?"default":"pointer",transition:"all .25s cubic-bezier(0.34,1.56,0.64,1)",
                      backdropFilter:"blur(10px)",outline:"none",width:"100%",textAlign:"left",
                      opacity:isOutOfStock?0.5:1,
                      animation:"fadeUp .4s ease forwards",animationDelay:(i*0.1+0.1)+"s"}}
                    onMouseEnter={e=>{ if(!isOutOfStock){e.currentTarget.style.borderColor=m.color+"60";e.currentTarget.style.transform="translateY(-4px) scale(1.01)";e.currentTarget.style.boxShadow="0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px "+m.color+"30";}}}
                    onMouseLeave={e=>{ if(!isOutOfStock){e.currentTarget.style.borderColor="rgba(255,255,255,.08)";e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none";}}}>

                    <div style={{flexShrink:0,opacity:isOutOfStock?0.5:1}}>{NET_LOGO[n]}</div>

                    <div style={{flex:1,minWidth:0}}>
                      <div className="syne" style={{fontWeight:700,fontSize:18,color:isOutOfStock?"rgba(255,255,255,.3)":"#fff",marginBottom:4}}>{n}</div>
                      {isOutOfStock?(
                        <div style={{fontSize:13,color:"rgba(255,80,80,.6)",fontWeight:600}}>Out of stock</div>
                      ):(
                        <>
                          <div style={{fontSize:13,color:"rgba(255,255,255,.4)"}}>
                            {BASE_BUNDLES[n].length} bundles available
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                            <div style={{background:m.color+"20",border:"1px solid "+m.color+"40",
                              borderRadius:8,padding:"3px 10px",display:"inline-block"}}>
                              <span style={{fontSize:12,fontWeight:700,color:m.color}}>from GH₵ {minPrice.toFixed(2)}</span>
                            </div>
                          </div>
                        </>
                      )}
                    </div>

                    {isOutOfStock?(
                      <div style={{fontSize:11,fontWeight:700,color:"rgba(255,80,80,.5)",
                        background:"rgba(255,80,80,.1)",border:"1px solid rgba(255,80,80,.2)",
                        borderRadius:8,padding:"4px 10px",flexShrink:0}}>
                        SOON
                      </div>
                    ):(
                      <div style={{width:36,height:36,background:"rgba(255,255,255,.06)",borderRadius:12,
                        display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                          <path d="M6 12l4-4-4-4" stroke="rgba(255,255,255,.5)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>

            <div style={{textAlign:"center",marginTop:36,color:"rgba(255,255,255,.18)",fontSize:12}}>
              Secured by <span style={{color:"rgba(0,229,255,.5)",fontWeight:600}}>DataResell Pro</span> · Powered by Paystack
            </div>
          </>
        )}

        {/* ── BUNDLE LIST ── */}
        {network && !selected && (
          <>
            {/* Network hero banner */}
            <div style={{background:meta.grad,borderRadius:22,padding:"22px 24px",
              marginBottom:24,position:"relative",overflow:"hidden",
              boxShadow:"0 8px 40px "+meta.glow}}>
              <div style={{position:"absolute",top:-30,right:-30,width:120,height:120,
                background:"rgba(255,255,255,.1)",borderRadius:"50%"}}/>
              <div style={{position:"absolute",bottom:-20,left:"40%",width:80,height:80,
                background:"rgba(255,255,255,.08)",borderRadius:"50%"}}/>
              <div style={{position:"relative",display:"flex",alignItems:"center",gap:16}}>
                {NET_LOGO[network]}
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"rgba(0,0,0,.5)",letterSpacing:1,marginBottom:4,textTransform:"uppercase"}}>
                    Choose Your Plan
                  </div>
                  <div className="syne" style={{fontWeight:800,fontSize:22,color:"#000",lineHeight:1}}>
                    {network} Data Bundles
                  </div>
                  <div style={{fontSize:12,color:"rgba(0,0,0,.45)",marginTop:4}}>
                    {bundles.length} plans · Instant activation
                  </div>
                </div>
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {bundles.map((b,i)=>{
                const price = getPrice(b);
                return(
                  <div key={b.id}
                    style={{background:"rgba(255,255,255,.04)",backdropFilter:"blur(10px)",
                      border:"1.5px solid rgba(255,255,255,.07)",borderRadius:18,padding:"16px 18px",
                      display:"flex",alignItems:"center",justifyContent:"space-between",
                      cursor:"pointer",transition:"all .2s cubic-bezier(0.34,1.56,0.64,1)",
                      animation:"fadeUp .35s ease forwards",animationDelay:(i*0.06+0.05)+"s",opacity:0}}
                    onClick={()=>setSelected(b)}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=meta.color+"50";e.currentTarget.style.transform="translateY(-2px) scale(1.01)";e.currentTarget.style.background="rgba(255,255,255,.07)";e.currentTarget.style.boxShadow="0 10px 30px rgba(0,0,0,0.3)";}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor="rgba(255,255,255,.07)";e.currentTarget.style.transform="none";e.currentTarget.style.background="rgba(255,255,255,.04)";e.currentTarget.style.boxShadow="none";}}>

                    <div style={{display:"flex",alignItems:"center",gap:14}}>
                      <div style={{width:52,height:52,background:meta.color+"18",border:"1.5px solid "+meta.color+"30",
                        borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <span className="syne" style={{fontWeight:800,fontSize:15,color:meta.color}}>{b.label}</span>
                      </div>
                      <div>
                        <div style={{fontWeight:700,fontSize:16,color:"#fff",marginBottom:2}}>{b.label} Data</div>
                        <div style={{fontSize:12,color:"rgba(255,255,255,.35)"}}>Valid 30 days</div>
                      </div>
                    </div>

                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,color:"rgba(255,255,255,.3)",fontWeight:600,marginBottom:1}}>GH₵</div>
                        <div className="syne" style={{fontSize:24,fontWeight:900,color:"#fff",lineHeight:1}}>{price.toFixed(2)}</div>
                      </div>
                      <div style={{width:36,height:36,background:meta.color+"25",border:"1px solid "+meta.color+"40",
                        borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                          <path d="M5 10.5l4-3.5-4-3.5" stroke={meta.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ── CHECKOUT ── */}
        {network && selected && (
          <div style={{animation:"fadeUp .35s ease"}}>
            {/* Order summary card */}
            <div style={{background:meta.grad,borderRadius:22,padding:"24px",marginBottom:16,
              position:"relative",overflow:"hidden",boxShadow:"0 8px 40px "+meta.glow}}>
              <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,
                background:"rgba(255,255,255,.12)",borderRadius:"50%"}}/>
              <div style={{position:"relative"}}>
                <div style={{fontSize:11,fontWeight:700,color:"rgba(0,0,0,.45)",letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>
                  Order Summary
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
                  <div>
                    <div className="syne" style={{fontSize:32,fontWeight:900,color:"#000",lineHeight:1}}>
                      {selected.label}
                    </div>
                    <div style={{fontSize:14,color:"rgba(0,0,0,.5)",marginTop:4}}>{network} Data Bundle</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12,color:"rgba(0,0,0,.4)",fontWeight:600}}>Total</div>
                    <div className="syne" style={{fontSize:32,fontWeight:900,color:"#000",lineHeight:1}}>
                      GH₵ {getPrice(selected).toFixed(2)}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Input form */}
            <div style={{background:"rgba(255,255,255,.04)",backdropFilter:"blur(10px)",
              border:"1px solid rgba(255,255,255,.08)",borderRadius:22,padding:24,marginBottom:14}}>

              <div style={{marginBottom:18}}>
                <label style={{fontSize:12,fontWeight:700,color:"rgba(255,255,255,.5)",
                  display:"block",marginBottom:10,letterSpacing:0.5,textTransform:"uppercase"}}>
                  📱 Phone Number to Receive Data
                </label>
                <input
                  style={{width:"100%",padding:"15px 18px",background:"rgba(255,255,255,.07)",
                    border:"1.5px solid rgba(255,255,255,.12)",borderRadius:14,
                    fontSize:17,fontFamily:"'DM Sans',sans-serif",outline:"none",
                    transition:"border .2s, background .2s",color:"#fff",letterSpacing:1}}
                  type="tel" placeholder="e.g. 0244 123 456"
                  value={phone} onChange={e=>setPhone(e.target.value)}
                  onFocus={e=>{e.target.style.borderColor=meta.color+"80";e.target.style.background="rgba(255,255,255,.1)";}}
                  onBlur={e=>{e.target.style.borderColor="rgba(255,255,255,.12)";e.target.style.background="rgba(255,255,255,.07)";}}/>
              </div>

              <div style={{marginBottom:24}}>
                <label style={{fontSize:12,fontWeight:700,color:"rgba(255,255,255,.5)",
                  display:"block",marginBottom:10,letterSpacing:0.5,textTransform:"uppercase"}}>
                  ✉️ Email (for receipt — optional)
                </label>
                <input
                  style={{width:"100%",padding:"15px 18px",background:"rgba(255,255,255,.07)",
                    border:"1.5px solid rgba(255,255,255,.12)",borderRadius:14,
                    fontSize:15,fontFamily:"'DM Sans',sans-serif",outline:"none",
                    transition:"border .2s, background .2s",color:"#fff"}}
                  type="email" placeholder="e.g. you@example.com"
                  value={email} onChange={e=>setEmail(e.target.value)}
                  onFocus={e=>{e.target.style.borderColor=meta.color+"80";e.target.style.background="rgba(255,255,255,.1)";}}
                  onBlur={e=>{e.target.style.borderColor="rgba(255,255,255,.12)";e.target.style.background="rgba(255,255,255,.07)";}}/>
              </div>

              <button className="paystack-btn" onClick={handlePaystack} disabled={buying}
                style={{background:meta.grad,color:"#000",fontWeight:900,fontSize:17,
                  opacity:buying?0.7:1,boxShadow:"0 8px 30px "+meta.glow}}>
                {buying
                  ? <><div style={{width:22,height:22,border:"2px solid rgba(0,0,0,.3)",borderTop:"2px solid #000",borderRadius:"50%",animation:"spin .7s linear infinite"}}/> Processing…</>
                  : <>🔒 Pay GH₵ {getPrice(selected).toFixed(2)} with Paystack</>
                }
              </button>

              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:14}}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <rect x="2" y="6" width="10" height="7" rx="2" stroke="rgba(255,255,255,.3)" strokeWidth="1.2"/>
                  <path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" stroke="rgba(255,255,255,.3)" strokeWidth="1.2" strokeLinecap="round"/>
                </svg>
                <span style={{fontSize:12,color:"rgba(255,255,255,.3)"}}>Secured by Paystack · SSL encrypted</span>
              </div>
            </div>

            <button onClick={()=>setSelected(null)}
              style={{background:"none",border:"none",cursor:"pointer",
                color:"rgba(255,255,255,.4)",fontSize:14,padding:"8px 4px",
                fontFamily:"'DM Sans',sans-serif",transition:"color .2s",display:"flex",alignItems:"center",gap:6}}
              onMouseEnter={e=>e.currentTarget.style.color="rgba(255,255,255,.7)"}
              onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.4)"}>
              ← Choose a different bundle
            </button>
          </div>
        )}

      </div>
    </div>
  );
}


/* ── WhatsApp Support Button ── */

    <a href="https://wa.me/233557877493" target="_blank" rel="noreferrer"
      title="Chat with support on WhatsApp"
      style={{position:"fixed",bottom:90,right:20,zIndex:9998,
        width:56,height:56,borderRadius:"50%",
        background:"linear-gradient(135deg,#25D366,#128C7E)",

function App(){
  const path = window.location.pathname;
  const storeMatch = path.match(/^\/store\/([^/]+)/);
  const storeSlug = storeMatch ? storeMatch[1] : null;

  const [screen, setScreen] = useState(storeSlug ? "storefront" : "landing");
  const [showAuth, setShowAuth] = useState(false);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [authTab, setAuthTab] = useState("signup");
  const [reseller, setReseller] = useState(null);

  const openSignup = () => { setAuthTab("signup"); setShowAuth(true); };
  const openLogin  = () => { setAuthTab("login");  setShowAuth(true); };
  const onSuccess  = r  => { setReseller(r); setShowAuth(false); setScreen("dashboard"); };

  if(screen==="storefront" && storeSlug) return <><StoreFront slug={storeSlug}/><WhatsAppSupport/></>;

  return(
    <>
      <WhatsAppSupport/>
      {screen==="landing"&&(
        <>
          <Landing onSignup={openSignup} onLogin={openLogin}/>
          {showAuth&&(
            <AuthModal
              defaultTab={authTab}
              onSuccess={onSuccess}
              onClose={()=>setShowAuth(false)}
            />
          )}
          {showAdminLogin&&(
            <AdminLoginModal
              onSuccess={()=>{ setShowAdminLogin(false); setScreen("admin"); }}
              onClose={()=>setShowAdminLogin(false)}
            />
          )}
          {/* Hidden admin trigger — triple-click logo or footer */}
          <div style={{position:"fixed",bottom:0,left:0,width:60,height:40,cursor:"default",zIndex:200}}
            onClick={()=>setShowAdminLogin(true)}/>
        </>
      )}
      {screen==="dashboard"&&reseller&&(
        <Dashboard reseller={reseller} onLogout={()=>{setReseller(null);setScreen("landing");}}/>
      )}
      {screen==="admin"&&(
        <AdminPanel onLogout={()=>setScreen("landing")}/>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
