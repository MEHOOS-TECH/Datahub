<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DataResell Pro</title>

<!-- React + Babel (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Clash+Display:wght@500;600;700&display=swap" rel="stylesheet"/>

<!-- Paystack -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<!-- App styles -->
<link rel="stylesheet" href="style.css"/>

<!-- Loading screen shown until React mounts -->
<style>
  #loader{position:fixed;inset:0;background:#0a0f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;}
  #loader.hidden{opacity:0;pointer-events:none;}
  .ld-spin{width:44px;height:44px;border:3px solid rgba(0,229,255,.2);border-top-color:#00e5ff;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px;}
  .ld-text{color:#6b7fa3;font-family:sans-serif;font-size:14px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- Loading indicator -->
<div id="loader">
  <div class="ld-spin"></div>
  <div class="ld-text">Loading…</div>
</div>

<div id="root"></div>

<!-- Fetch and compile app.js as JSX at runtime (Babel standalone requires this approach) -->
<script>
  fetch("app.js")
    .then(r => r.text())
    .then(code => {
      const script = document.createElement("script");
      script.type = "text/babel";
      script.setAttribute("data-presets", "react");
      script.textContent = code;
      document.body.appendChild(script);
      Babel.transformScriptTags();
      // Hide loader once React has had a tick to mount
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          const loader = document.getElementById("loader");
          if(loader) loader.classList.add("hidden");
          setTimeout(()=>{ if(loader) loader.remove(); }, 500);
        });
      });
    })
    .catch(err => {
      document.getElementById("loader").innerHTML =
        '<div style="color:#ff4d6d;font-family:sans-serif;text-align:center;padding:20px">Failed to load app.<br>Please refresh.</div>';
    });
</script>
</body>
</html>
